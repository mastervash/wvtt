# nginx site for WVTT.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/wvtt
#   sudo ln -s /etc/nginx/sites-available/wvtt /etc/nginx/sites-enabled/wvtt
#   sudo nginx -t && sudo systemctl reload nginx
#
# For TLS, run certbot --nginx after the HTTP block below is serving; it will add the
# 443 server block and the redirect for you.

server {
    listen 80;
    listen [::]:80;
    server_name _;            # replace with your hostname

    # The client bundle is a few hundred KB of JavaScript; compressing it matters most
    # on a phone connection.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The game is a single upstream: the Node process serves the built client, the JSON
    # API, and the Colyseus websocket.
    location / {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;

        # Required for the websocket upgrade that carries all game traffic.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A table can sit idle between turns; do not cut the socket while people think.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Realtime traffic should not be buffered.
        proxy_buffering off;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        proxy_pass http://127.0.0.1:2567;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 8m;   # room for a pasted pack with embedded images
}
